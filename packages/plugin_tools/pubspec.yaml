name: plugin_tools
description: "AntiSIT 插件包：tools 功能插件"
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ^3.9.2

# 与宿主同属一个 pub workspace：根目录一次 `flutter pub get` 解析全部包
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  campus_core:
    path: ../campus_core
  # 扫一扫：工具页顶栏的二维码入口用「扫一扫能力」，不 import 它的包，
  # 装了扫一扫插件才有入口（没装就是普通工具页）。
  plugin_scan:
    path: ../plugin_scan