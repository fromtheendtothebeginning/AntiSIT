name: plugin_reminder
description: "AntiSIT 插件包：reminder 功能插件"
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ^3.9.2

# 与宿主同属一个 pub workspace：根目录一次 `flutter pub get` 解析全部包
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  campus_core:
    path: ../campus_core
  # 通知排期随实现一起搬进了本包（以前挂在 core 的依赖上）
  flutter_local_notifications: ^19.5.0
  shared_preferences: ^2.5.5
  timezone: ^0.10.1
