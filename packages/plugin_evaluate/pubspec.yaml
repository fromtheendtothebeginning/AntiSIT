name: plugin_evaluate
description: "AntiSIT 插件包：学生评教（原生界面，直连教务协议，一键给全部老师打分）"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.9.2

# 与宿主同属一个 pub workspace：根目录一次 `flutter pub get` 解析全部包
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  campus_core:
    path: ../campus_core
  # 解析评教表单 HTML（指标 / 权重 / 隐藏字段都在 DOM 上）
  html: ^0.15.6
  shared_preferences: ^2.5.5
