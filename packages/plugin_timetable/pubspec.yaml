name: plugin_timetable
description: "AntiSIT 插件包：timetable 功能插件"
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ^3.9.2

# 与宿主同属一个 pub workspace：根目录一次 `flutter pub get` 解析全部包
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  campus_core:
    path: ../campus_core
  image_picker: ^1.2.0
  # 课表自定义背景：把图库里的图拷进应用目录保存
  path_provider: ^2.1.5
