name: plugin_ext
description: "AntiSIT 插件包：ext 功能插件"
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ^3.9.2

# 与宿主同属一个 pub workspace：根目录一次 `flutter pub get` 解析全部包
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  campus_core:
    path: ../campus_core
  # 拓展清单与每个拓展自己的存储都落在本地（plugin.ext.* 前缀）
  shared_preferences: ^2.5.5
  # 导入 html/js/css 压缩包：解压到本地后内联成一份自包含页面
  archive: ^4.0.0
  path_provider: ^2.1.5
  # 选压缩包文件
  file_selector: ^1.0.3
  # 插件市场：拉目录 / 下载拓展包
  http: ^1.5.0
  # 校验拓展包内容与市场目录签名（sha256 + Ed25519）
  crypto: ^3.0.0
  cryptography: ^2.9.0
  # 市场里「需要升级 App」判断：拿本机版本号跟条目的 minAppVersion 比
  package_info_plus: ^9.0.1
