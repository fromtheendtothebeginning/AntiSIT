name: Release APK

# 发版 = 打 tag，两种 tag 对应两个更新渠道：
#   稳定版：tag 名与 pubspec.yaml 的 version 一致（如 v1.0.4 ↔ 1.0.4+n），发正式 Release；
#   内测版：tag 形如 dev-1.48.0-dev.2，发成 prerelease（App 的内测版渠道只认这种带预发布段的版本）。
# 推上去即自动构建 release APK 并发布 GitHub Release（APK + sha256 校验文件都挂上去）。
on:
  push:
    tags: ['v*', 'dev-*']

permissions:
  contents: write # gh release create 需要写权限

jobs:
  apk:
    # 钉在 24.04：ubuntu-latest 已滚动到 26，新镜像上 Gradle 发行包
    # （gradle-8.14-all.zip，从 github.com 拉 ~230MB）下载会失败，2026-11-08 v1.28.3 实测。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：Release 说明要按 tag 区间列提交

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: 补齐 Android SDK 组件
        # GitHub 的 ubuntu 镜像自带 Android SDK（ANDROID_SDK_ROOT 已设，platform 36 与
        # build-tools 36.x 预装），这里只保证版本齐全，不额外装 SDK 管理器。
        #
        # android-35 也要装：workmanager_android 0.9.2 的 build.gradle 把 compileSdk
        # 写死成 35，只给 36 时 Gradle 会去找 35（找不到是构建失败，v1.48.0 首发就挂在这）。
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          "$SDKM" --install "platforms;android-36" "platforms;android-35" "build-tools;36.1.0"

      - name: 校验 tag 与 pubspec 版本号一致
        # 稳定版 tag = v<version>；内测版 tag = dev-<version>（version 自带 -dev.N 预发布段）。
        # 两者都要求 tag 去掉前缀后与 pubspec.yaml 的 version 完全对上，避免发错版本。
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9A-Za-z.+-]*\)$/\1/p' pubspec.yaml | head -1)
          # 去掉构建号：1.48.0-dev.2+206 → 1.48.0-dev.2
          VERSION=${VERSION%%+*}
          REF=${GITHUB_REF_NAME}
          if [ "$REF" = "v$VERSION" ]; then
            CHANNEL=stable
          elif [ "$REF" = "dev-$VERSION" ]; then
            CHANNEL=dev
          else
            echo "tag $REF 与 pubspec.yaml 的 version $VERSION 不一致"
            echo "稳定版打 v$VERSION，内测版打 dev-$VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: 预装 Gradle 发行包（多源下载，绕开发行包 CDN 故障）
        # services.gradle.org 的发行包会 302 到 github 的发行包 CDN，该 CDN 2026-11-08
        # 间歇 504，Gradle 自带的下载毫无重试，连续 6 次构建全挂在它上面。
        # 这里用 curl 按源链轮询下载（github → 腾讯镜像 → 自建镜像），按 Gradle 的
        # 哈希规则（发行 URL 的 MD5 → base36）解压进 wrapper 的 dists 目录并打 .ok
        # 标记——构建时 wrapper 看到标记就不再下载。
        run: |
          set -e
          DIST_URL="https://services.gradle.org/distributions/gradle-8.14-bin.zip"
          HASH=$(python3 -c "
          import hashlib
          v = int.from_bytes(hashlib.md5('$DIST_URL'.encode()).digest(), 'big')
          chars = '0123456789abcdefghijklmnopqrstuvwxyz'
          out = ''
          while v:
              v, r = divmod(v, 36)
              out = chars[r] + out
          print(out)")
          DEST="$HOME/.gradle/wrapper/dists/gradle-8.14-bin/$HASH"
          mkdir -p "$DEST"
          TMPZIP="$HOME/gradle-8.14-bin.zip"
          for src in "https://github.com/gradle/gradle-distributions/releases/download/v8.14.0/gradle-8.14-bin.zip" "https://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip" "https://anticraft.top/dist/gradle/gradle-8.14-bin.zip"; do
            echo "尝试发行包源: $src"
            if curl -fL --retry 3 --retry-all-errors --max-time 900 -o "$TMPZIP" "$src" && [ "$(stat -c%s "$TMPZIP")" -gt 100000000 ]; then
              break
            fi
            echo "  该源失败，换下一个"
          done
          [ "$(stat -c%s "$TMPZIP")" -gt 100000000 ] || { echo "所有源都拉不到 Gradle 发行包" >&2; exit 1; }
          unzip -oq "$TMPZIP" -d "$DEST"
          touch "$DEST/gradle-8.14-bin.zip.ok"
          echo "已预装: $DEST/gradle-8.14"

      - name: 配置发布签名
        # 仓库不再内置签名私钥：必须从 GitHub Secrets 取。缺任何一个都直接失败，
        # 避免误发一把临时/错误密钥签名的包。轮换步骤见 README「发布签名」。
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "缺少发布签名 Secrets：RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "已用 GitHub Secrets 配置发布签名"

      - name: 构建 APK
        # runner 的网络偶尔抽风：依赖下载超时 / 连接被重置，flutter 只会给一句
        # "Gradle threw an error while downloading artifacts from the network"。
        # 这种抖动不该毁掉一次发布，重试几次（Gradle 会复用已下好的部分，越试越快）。
        #
        # 日志：v1.48.0 这次在 ~195s 处失败（前面装 SDK、拉 Gradle 都成功），
        # 重试三次全挂在同一步，**不是网络抖动**。构建输出默认被 flutter 收进
        # 一行概括里，看不到真正的 Gradle 报错，所以这里把完整日志落盘并在失败时
        # 打出来——下次一眼就能看到是哪条 task 挂了。
        run: |
          set -o pipefail
          LOG=build/gradle-ci.log
          mkdir -p build
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次构建 ---"
            if flutter build apk --release 2>&1 | tee "$LOG"; then
              exit 0
            fi
            echo "=== 本次失败的 Gradle 错误摘要 ==="
            grep -nE "(FAILURE|What went wrong|error:|e: |Could not|Couldn't|Unresolved|Execution failed|> Task .*FAILED)" "$LOG" | tail -40 || tail -60 "$LOG"
            sleep 20
          done
          echo "连续 3 次构建失败，请看上面的 Gradle 日志定位原因" >&2
          exit 1
      - name: 失败时把构建日志推到 ci-logs 分支
        # 开发者本机常常连不上 github.com，读不到 Actions 日志（API 也要鉴权）。
        # 失败时把日志提交到独立分支，之后用 contents API 匿名就能取：
        #   https://api.github.com/repos/<repo>/contents/gradle-ci.log?ref=ci-logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          RADDR="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          mkdir -p /tmp/ci-log && cd /tmp/ci-log
          cp "$GITHUB_WORKSPACE/build/gradle-ci.log" . 2>/dev/null || echo "没有抓到构建日志" > gradle-ci.log
          # 只留尾部 4000 行，分支体积别随发版次数膨胀
          tail -4000 gradle-ci.log > tmp.log && mv tmp.log gradle-ci.log
          git init -q && git checkout -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@antisit.local commit -qm "构建失败日志（tag $GITHUB_REF_NAME）"
          git push -f "$RADDR" ci-logs
          echo "日志分支已更新：ci-logs"

      - name: 校验签名指纹
        env:
          # 私有密钥证书的 SHA-1（去冒号、小写）
          WANT: ${{ secrets.RELEASE_CERT_SHA1 }}
        run: |
          if [ -z "$WANT" ]; then
            echo "缺少 RELEASE_CERT_SHA1（发布证书 SHA-1，去冒号小写）" >&2
            exit 1
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*SHA-1 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK 签名 SHA-1：$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "APK 签名指纹 $GOT 与期望 $WANT 不符：检查签名配置（key.properties / Secrets）后重试"
            exit 1
          fi

      - name: 整理发布物与说明
        run: |
          APK_NAME="AntiSIT-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          {
            echo "## AntiSIT ${VERSION}"
            echo
            if [ "${CHANNEL}" = "dev" ]; then
              echo "**内测版**：会收到正在开发中的改动，可能不稳定；App 的「内测版」渠道只跟这种带预发布段的版本。"
              echo
            fi
            echo "APK 直装（Android 7.0+）：下载 \`${APK_NAME}\` 安装，首次需允许「未知来源」。"
            echo
            echo "- 同一把发布密钥签名的版本可直接覆盖安装；覆盖安装会保留数据（登录态、课表）"
            echo "- 从本机 \`flutter run\` / debug 构建换过来，或此前装的是其它签名的包，需先卸载"
            echo "- 校验下载：\`sha256sum -c ${APK_NAME}.sha256\`"
            echo
            echo "### 本次更新"
            # 优先用 App 内更新日志里这一版的条目（那是写给用户看的人话），
            # 取不到才退回 git log（「发版：…」「测试：…」这类工程提交用户看不懂）。
            if ! PYTHONIOENCODING=utf-8 bash tool/release_notes.sh "${VERSION}" 2>/dev/null; then
              PREV=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "$PREV..HEAD"
              else
                git log --no-merges --pretty='- %s' -n 15
              fi
            fi
          } > release-notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "AntiSIT ${VERSION}" \
              --notes-file release-notes.md \
              "AntiSIT-${VERSION}.apk" "AntiSIT-${VERSION}.apk.sha256"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "AntiSIT-${VERSION}.apk" "AntiSIT-${VERSION}.apk.sha256" --clobber
          # 显式置为正式发布：tag 若被删过再重建，GitHub 会把 release 降级成草稿，
          # 匿名用户既看不到也下不了（页面直接报「没有 release」）。
          # 内测版标成 prerelease：GitHub 的 /releases/latest 会跳过它，稳定版渠道不受影响。
          PRERELEASE=false
          if [ "${CHANNEL}" = "dev" ]; then PRERELEASE=true; fi
          gh release edit "$GITHUB_REF_NAME" --title "AntiSIT ${VERSION}" \
            --notes-file release-notes.md --draft=false --prerelease=$PRERELEASE
          echo "--- 发布结果 ---"
          gh release view "$GITHUB_REF_NAME"
