name: Release APK

# 发版 = 打 tag：tag 名必须与 pubspec.yaml 的 version 一致（如 v1.0.4 ↔ 1.0.4+n），
# 推上去即自动构建 release APK 并发布 GitHub Release（APK + sha256 校验文件都挂上去）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create 需要写权限

jobs:
  apk:
    # 钉在 24.04：ubuntu-latest 已滚动到 26，新镜像上 Gradle 发行包
    # （gradle-8.14-all.zip，从 github.com 拉 ~230MB）下载会失败，2026-11-08 v1.28.3 实测。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史：Release 说明要按 tag 区间列提交

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: 补齐 Android SDK 组件
        # GitHub 的 ubuntu 镜像自带 Android SDK（ANDROID_SDK_ROOT 已设，platform 36 与
        # build-tools 36.x 预装），这里只保证版本齐全，不额外装 SDK 管理器。
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          "$SDKM" --install "platforms;android-36" "build-tools;36.1.0"

      - name: 校验 tag 与 pubspec 版本号一致
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 pubspec.yaml 的 version $VERSION 不一致，请先升版本号再打 tag"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 预装 Gradle 发行包（多源下载，绕开发行包 CDN 故障）
        # services.gradle.org 的发行包会 302 到 github 的发行包 CDN，该 CDN 2026-11-08
        # 间歇 504，Gradle 自带的下载毫无重试，连续 6 次构建全挂在它上面。
        # 这里用 curl 按源链轮询下载（github → 腾讯镜像 → 自建镜像），按 Gradle 的
        # 哈希规则（发行 URL 的 MD5 → base36）解压进 wrapper 的 dists 目录并打 .ok
        # 标记——构建时 wrapper 看到标记就不再下载。
        run: |
          set -e
          DIST_URL="https://services.gradle.org/distributions/gradle-8.14-bin.zip"
          HASH=$(python3 -c "
          import hashlib
          v = int.from_bytes(hashlib.md5('$DIST_URL'.encode()).digest(), 'big')
          chars = '0123456789abcdefghijklmnopqrstuvwxyz'
          out = ''
          while v:
              v, r = divmod(v, 36)
              out = chars[r] + out
          print(out)")
          DEST="$HOME/.gradle/wrapper/dists/gradle-8.14-bin/$HASH"
          mkdir -p "$DEST"
          TMPZIP="$HOME/gradle-8.14-bin.zip"
          for src in "https://github.com/gradle/gradle-distributions/releases/download/v8.14.0/gradle-8.14-bin.zip" "https://mirrors.cloud.tencent.com/gradle/gradle-8.14-bin.zip" "https://anticraft.top/dist/gradle/gradle-8.14-bin.zip"; do
            echo "尝试发行包源: $src"
            if curl -fL --retry 3 --retry-all-errors --max-time 900 -o "$TMPZIP" "$src" && [ "$(stat -c%s "$TMPZIP")" -gt 100000000 ]; then
              break
            fi
            echo "  该源失败，换下一个"
          done
          [ "$(stat -c%s "$TMPZIP")" -gt 100000000 ] || { echo "所有源都拉不到 Gradle 发行包" >&2; exit 1; }
          unzip -oq "$TMPZIP" -d "$DEST"
          touch "$DEST/gradle-8.14-bin.zip.ok"
          echo "已预装: $DEST/gradle-8.14"

      - name: 构建 APK
        # runner 的网络偶尔抽风：依赖下载超时 / 连接被重置，flutter 只会给一句
        # "Gradle threw an error while downloading artifacts from the network"。
        # 这种抖动不该毁掉一次发布，重试几次（Gradle 会复用已下好的部分，越试越快）。
        run: |
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次构建 ---"
            if flutter build apk --release; then
              exit 0
            fi
            sleep 20
          done
          echo "连续 3 次构建失败，请看上面的 Gradle 日志定位原因" >&2
          exit 1

      - name: 校验签名指纹
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*SHA-1 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          WANT=498c439fcafb1304cb3461514575a19c768765e5
          echo "APK 签名 SHA-1：$GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "签名指纹与仓库内的 android/app/release.keystore 不符——换了密钥就发不出能覆盖安装的版本，中止发布"
            exit 1
          fi

      - name: 整理发布物与说明
        run: |
          APK_NAME="AntiSIT-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          {
            echo "## AntiSIT ${VERSION}"
            echo
            echo "APK 直装（Android 7.0+）：下载 \`${APK_NAME}\` 安装，首次需允许「未知来源」。"
            echo
            echo "- 同一把发布密钥签名的版本可直接覆盖安装；覆盖安装会保留数据（登录态、课表）"
            echo "- 从本机 \`flutter run\` / debug 构建换过来，或此前装的是其它签名的包，需先卸载"
            echo "- 校验下载：\`sha256sum -c ${APK_NAME}.sha256\`"
            echo
            echo "### 本次更新"
            PREV=$(git describe --tags --abbrev=0 'HEAD^' 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "$PREV..HEAD"
            else
              git log --no-merges --pretty='- %s' -n 15
            fi
          } > release-notes.md

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "AntiSIT ${VERSION}" \
              --notes-file release-notes.md \
              "AntiSIT-${VERSION}.apk" "AntiSIT-${VERSION}.apk.sha256"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "AntiSIT-${VERSION}.apk" "AntiSIT-${VERSION}.apk.sha256" --clobber
          # 显式置为正式发布：tag 若被删过再重建，GitHub 会把 release 降级成草稿，
          # 匿名用户既看不到也下不了（页面直接报「没有 release」）。
          gh release edit "$GITHUB_REF_NAME" --title "AntiSIT ${VERSION}" \
            --notes-file release-notes.md --draft=false --prerelease=false
          echo "--- 发布结果 ---"
          gh release view "$GITHUB_REF_NAME"
